name: Build & Release
on:
  push: { }

env:
  APP_NAME: "DepartureSound"
  NAMESPACE: "DepartureSound"
  TZ: "Asia/Tokyo"

jobs:
  calc_version:
    runs-on: ubuntu-latest
    name: "Calc Version"
    outputs:
      VERSION: ${{ steps.calc_version.outputs.VERSION }}
      APP_PREFIX: ${{ steps.calc_version.outputs.APP_PREFIX }}
    steps:
      - name: Get latest release
        id: latest_release
        uses: actions/github-script@v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          script: |
            try {
              const response = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              return response.data.tag_name;
            }
            catch (e){
              if (e.status === 404) {
                return '';
              } else {
                throw e;
              }
            }

      - name: Calculate Version
        id: calc_version
        run: |
          latest_tag="${{ steps.latest_release.outputs.result }}"
          if [ -n "${latest_tag}" ]; then
            today=$(date +%Y%m%d)
            if [[ $latest_tag == *$today* ]]; then
              n=$(echo $latest_tag | awk -F. '{print $4}')
              n=$((n + 1))
            else
              n=1
            fi
            VERSION="v1.0.${today}.${n}-beta"
          else
            VERSION=$(date +%Y%m%d%H%M%S)
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          file_name_version=$(echo "$VERSION" | sed 's/\./_/g')
          echo "APP_PREFIX=${{ env.APP_NAME }}_${file_name_version}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: windows-latest   # ← ★ ここが重要（Windows でビルド）
    needs: calc_version
    name: "Build"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Generate ServerAddress.cs
        run: |
          $content = @"
          namespace ${{ env.NAMESPACE }};
          public static class ServerAddress {
              public const string SignalAddress = "${{ secrets.SERVER_ADDRESS }}";
              public const string Version = "${{ needs.calc_version.outputs.VERSION }}";
          }
          "@
          $content | Out-File -FilePath "./ServerAddress.cs" -Encoding utf8

      - name: Restore NuGet packages
        run: nuget restore "車掌用知らせ灯.sln"

      - name: Build with MSBuild
        run: msbuild "車掌用知らせ灯.sln" /p:Configuration=Release /p:Platform="Any CPU"

      - name: Zip output
        run: |
          powershell Compress-Archive -Path "./bin/Release/*" -DestinationPath "${{ needs.calc_version.outputs.APP_PREFIX }}.zip"

      - name: Upload ZIP (artifact)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ needs.calc_version.outputs.APP_PREFIX }}.zip
          path: ./${{ needs.calc_version.outputs.APP_PREFIX }}.zip

  release:
    runs-on: ubuntu-latest
    name: "Create Release"
    needs:
      - calc_version
      - build
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4.2.1
        with:
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ needs.calc_version.outputs.VERSION }}
          files: out/*.zip
          make_latest: ${{ github.ref == 'refs/heads/master' }}
          prerelease: ${{ github.ref != 'refs/heads/master' }}